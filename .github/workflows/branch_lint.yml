name: 🌿 Branch Name & Task Format Quality Gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  branch_lint:
    name: Validate Branch & Task Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Branch Name
        id: branch_check
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "🔍 Checking branch name: $BRANCH_NAME"

          REGEX="^(feat|fix|docs|test|refactor|chore|ci|build|perf)/(lr-[0-9]{2}|infra|hotfix|[a-z0-9-]+)(-[a-z0-9-]+)*$|^dependabot/.*$"

          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "::error title=Invalid Branch Name::Branch name '$BRANCH_NAME' violates 42 ft_linear_regression naming convention."
            echo ""
            echo "========================================================================"
            echo " ⛔ REPROVADO: NOME DA BRANCH FORA DO PADRÃO INSTITUCIONAL"
            echo "========================================================================"
            echo " ❌ Branch atual: '$BRANCH_NAME'"
            echo ""
            echo " 📐 Formato Obrigatório:"
            echo "    <type>/<task-id>-<descrição-em-kebab-case>"
            echo ""
            echo " 📌 Exemplos Válidos:"
            echo "    feat/lr-01-data-pipeline"
            echo "    feat/lr-02-gradient-descent"
            echo "    fix/lr-04-learning-rate-divergence"
            echo "    docs/lr-07-peer-defense"
            echo "    chore/infra-makefile-update"
            echo ""
            echo " 🔧 Como corrigir localmente:"
            echo "    git branch -m $BRANCH_NAME feat/<task-id>-<descrição>"
            echo "    git push origin -u feat/<task-id>-<descrição>"
            echo "    git push origin --delete $BRANCH_NAME"
            echo "========================================================================"
            exit 1
          fi

          echo "✅ Branch name '$BRANCH_NAME' is valid and complies with 42 governance."
